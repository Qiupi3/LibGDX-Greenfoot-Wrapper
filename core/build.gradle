[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

// Add source sets to include user-project classes
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/main/java/user-project']
        }
    }
}

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

// Enhanced task to automatically detect and copy Greenfoot project assets
// preserving the project folder structure inside assets/.
tasks.register('copyGreenfootAssets') {
    description 'Detects the Greenfoot project folder inside user-project/ and copies it to assets/ preserving structure'

    def userProjectDir = file('src/main/java/user-project')
    def assetsDir = file('../assets')

    // Gradle up-to-date checking
    inputs.dir(userProjectDir).optional()
    outputs.dir(assetsDir)

    doLast {
        if (!userProjectDir.exists() || !userProjectDir.isDirectory()) {
            println "copyGreenfootAssets: user-project directory not found at ${userProjectDir.absolutePath}"
            return
        }

        // --- Step 1: find the project subfolder (contains project.greenfoot) ---
        File detectedProjectDir = null
        String detectedProjectName = null

        userProjectDir.eachDir { subdir ->
            File marker = new File(subdir, 'project.greenfoot')
            if (marker.exists()) {
                detectedProjectDir = subdir
                detectedProjectName = subdir.name
            }
        }

        if (detectedProjectDir == null) {
            println "copyGreenfootAssets: WARNING – no subfolder with project.greenfoot found in ${userProjectDir.absolutePath}"
            println "copyGreenfootAssets: Make sure your Greenfoot project folder (e.g. MyGame/) is placed inside core/src/main/java/user-project/"
            return
        }

        println "copyGreenfootAssets: Detected project folder: ${detectedProjectName}"

        // --- Step 2: copy the whole project subfolder into assets/<ProjectName>/ ---
        File targetDir = new File(assetsDir, detectedProjectName)

        // Clean previous copy to avoid stale files
        if (targetDir.exists()) {
            project.delete(targetDir)
        }

        project.copy {
            from detectedProjectDir
            into targetDir
            // Exclude Java source files – they are compiled, not loaded as assets
            exclude '**/*.java'
            exclude '**/*.class'
        }

        println "copyGreenfootAssets: Copied ${detectedProjectName}/ -> assets/${detectedProjectName}/"

        // --- Step 3: write project_cache.txt so runtime detection is instant ---
        File cacheFile = new File(assetsDir, 'project_cache.txt')
        cacheFile.text = detectedProjectName
        println "copyGreenfootAssets: Wrote project_cache.txt = ${detectedProjectName}"

        // --- Step 4: summary ---
        println "Assets directory contents after copy:"
        assetsDir.eachFileRecurse { f ->
            if (f.isFile()) {
                println "  - ${assetsDir.toPath().relativize(f.toPath())}"
            }
        }
    }
}

// Make sure assets are copied before any build tasks
tasks.named('compileJava').configure {
    dependsOn 'copyGreenfootAssets'
}

// Also ensure the Android tasks depend on our asset copying
afterEvaluate {
    // For desktop (lwjgl3)
    if (project(':lwjgl3') != null) {
        project(':lwjgl3').tasks.matching { it.name.contains('processResources') }.all {
            dependsOn ':core:copyGreenfootAssets'
        }
    }

    // For Android
    if (project(':android') != null) {
        project(':android').tasks.matching { it.name.contains('mergeDebugAssets') }.all {
            dependsOn ':core:copyGreenfootAssets'
        }
        project(':android').tasks.matching { it.name.contains('mergeReleaseAssets') }.all {
            dependsOn ':core:copyGreenfootAssets'
        }
    }
}
