# On-screen pad for touch platforms (Android). Delete a line to keep the default.
#
# layout      4-2 = d-pad on the left, two stacked on the right
#             4-4 = d-pad on the left, four on the right
#             4-1 = d-pad on the left, one button on the right
#             2-2 = left/right only on each side, no up or down
# left_*      the d-pad; right_1..right_4 the right-hand buttons
# special     a tap anywhere that is not on a button
# hide_for    class names - worlds or actors - that hide the pad while on screen

layout     = 4-2

left_up    = w
left_left  = a
left_down  = s
left_right = d

right_1    = f
right_2    = enter

special    = space

hide_for   = MainMenu, Credit, Controls, Win, GameOver

opacity    = 0.72
scale      = 1.0

debug      = false
